<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <!-- Load Tailwind CSS from CDN for styling -->
   <!-- <script src="https://cdn.tailwindcss.com"></script>-->
    <style>
        /* Use Inter font for a clean, modern look */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Main container for the form -->
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-lg border border-slate-200">
        
        <!-- Form Title -->
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Login</h2>
        
        <!-- The login form -->
        <form id="loginForm" class="space-y-6">
            
            <!-- Username Input Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Username</label>
                <input 
                    type="text" 
                    id="email" 
                    name="email" 
                    class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter your email"
                    required
                >
            </div>
            
            <!-- Password Input Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter your password"
                    required
                >
            </div>
            
            <!-- Submit Button -->
            <div>
                <button 
                    type="submit" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
                >
                    Log In
                </button>
            </div>
            
        </form>
    </div>

    <!-- Simple JavaScript to handle form submission without reloading the page -->
    <script>
        let isAuthentcated = false;

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Prevent the default form submission
            event.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            // Log the form data to the console for demonstration
            console.log('Email:', email);
            console.log('Password:', password);
           

            const url = 'http://127.0.0.1:8000/login/'; // Replace with your URL
            const data = {
                email: email,
                password: password
            };

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data), // Convert the data to a JSON string
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                console.log('Success:', data);
            }).then( data =>{
                 isAuthentcated = true;
                 console.log(isAuthentcated)
                 window.location.pathname = '/forum/choice_room/'
            }
               
            )
            .catch(error => {
                console.error('Error:', error);
            });

            }
            );

     
                 
    </script>

</body>
</html>
